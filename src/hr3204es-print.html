<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huenú hr3204es — PDF listo para guardar</title>
<style>
  @page { size:A4 portrait; margin:0; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:#e9eeea; font-family:Arial,sans-serif; }
  .hint { position:fixed; z-index:2; top:14px; left:50%; transform:translateX(-50%); padding:10px 16px; border-radius:999px; background:#17231b; color:#fff; font-size:13px; box-shadow:0 4px 18px rgba(0,0,0,.16); }
  .hint b { color:#39d322; }
  .sheets { display:flex; flex-direction:column; align-items:center; gap:18px; padding:54px 0 24px; }
  .sheet { width:210mm; height:297mm; overflow:hidden; background:#fff; box-shadow:0 4px 18px rgba(0,0,0,.18); }
  iframe { display:block; width:210mm; height:297mm; border:0; background:#fff; }
  @media print {
    html,body { width:210mm; height:auto; background:#fff; }
    .hint { display:none; }
    .sheets { display:block; padding:0; }
    .sheet { width:210mm; height:297mm; margin:0; box-shadow:none; break-after:page; page-break-after:always; }
    .sheet:last-child { break-after:auto; page-break-after:auto; }
  }
</style>
</head>
<body>
<div class="hint">Preparando PDF fiel al folleto…</div>
<main class="sheets" id="sheets"></main>
<script>
  if(/print=1/.test(location.search)){document.body.style.paddingTop='0';var _tb=document.querySelector('#edit-toolbar,.toolbar,nav.toolbar');if(_tb)_tb.style.display='none';}

  (function(){
    var requested=(new URLSearchParams(location.search).get('pages')||'1,2,3').split(',');
    var valid=requested.filter(function(page){return /^(1|2|3)$/.test(page);});
    var sheets=document.getElementById('sheets');
    valid.forEach(function(page){
      var section=document.createElement('section'); section.className='sheet';
      var frame=document.createElement('iframe'); frame.src='/hr3204es-p'+page+'.html?print=1&pie='+encodeURIComponent(new URLSearchParams(location.search).get('pie')||'huenu'); frame.title='Hoja '+page;
      section.appendChild(frame); sheets.appendChild(section);
    });
    var frames=[].slice.call(document.querySelectorAll('iframe'));
    Promise.all(frames.map(function(frame){return new Promise(function(resolve){frame.addEventListener('load',resolve,{once:true});});})).then(function(){
      document.querySelector('.hint').innerHTML='Listo. Elegí <b>Guardar como PDF</b> para descargarlo.';
      if(new URLSearchParams(location.search).get('autoprint')==='1') setTimeout(function(){window.print();},350);
    });
  })();
</script>
</body>
</html>
